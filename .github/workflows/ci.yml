name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up chain, deploy contract, start API
        run: docker compose up --build -d --wait api
      - name: Run the demo against the stack
        run: |
          pip install httpx
          PYTHONPATH=. python -m secureflow.demo --url http://localhost:8000 --api-key sf_demo_do_not_use_in_production
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

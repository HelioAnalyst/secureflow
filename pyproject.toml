[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secureflow"
version = "1.1.0"
description = "FastAPI service for issuing, verifying and revoking attestations on an Ethereum smart contract."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Helio" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "web3>=7.6,<8",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "web3[tester]>=7.6,<8",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
]
compile = ["py-solc-x>=2.0"]

[tool.setuptools]
packages = ["secureflow", "secureflow.ledger"]

[tool.setuptools.package-data]
secureflow = ["AttestationRegistry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=secureflow --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
omit = ["secureflow/demo.py", "secureflow/deploy.py"]  # CLIs, exercised by the demo and compose

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "\\.\\.\\."]

[tool.mypy]
python_version = "3.10"
packages = ["secureflow"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# web3's contract objects are dynamically typed; the adapter keeps them at the boundary.
module = ["secureflow.ledger.web3_ledger", "secureflow.deploy"]
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]
# These packages re-export their public API from submodules without __all__.
module = ["eth_utils", "eth_utils.*", "eth_abi", "eth_abi.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["eth_tester.*", "solcx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
